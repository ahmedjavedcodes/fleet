version: "3.9"

services:
  postgres:
    # pgvector-enabled build of Postgres 16 -- required by the agent memory
    # tables (semantic_memories.embedding is a vector(768) column).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  ai_agents:
    build: ./ai_agents
    restart: unless-stopped
    env_file:
      - ./ai_agents/.env
    depends_on:
      - postgres
      - backend
    ports:
      - "8100:8100"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
